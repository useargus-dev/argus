# Dependabot version updates disabled (no PRs). Vulnerability reporting is via
# Dependabot alerts in repo Settings → Code security (enable alerts; disable
# "Dependabot security updates" if you do not want auto-fix PRs either).
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
