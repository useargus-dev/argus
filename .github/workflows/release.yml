name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1) — also used for installer filenames"
        required: true
        type: string

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm lint

  create-release:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ inputs.tag }}',
              name: 'Argus ${{ inputs.tag }}',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set app version from release tag
        shell: bash
        run: node scripts/set-release-version.mjs "${{ inputs.tag }}"

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install

      - name: Prepare Tauri bundle (macOS)
        if: matrix.platform == 'macos-latest'
        run: node scripts/prepare-tauri-bundle.mjs macos --allow-missing

      - name: Build sidecars (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          CARGO_NET_RETRY: 10
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          sudo apt-get install -y clang llvm libbpf-dev llvm-dev
          export LIBCLANG_PATH=/usr/lib/llvm-14/lib
          bash scripts/install-ebpf-toolchain.sh
          for attempt in 1 2 3; do
            cargo build --release -p argus-cli -p argus-redirector-linux && break
            echo "cargo build failed (attempt $attempt/3); retrying in 15s..."
            sleep 15
          done
          test -x target/release/argus-cli
          test -x target/release/argus-redirector-linux
          node scripts/prepare-tauri-bundle.mjs linux

      - name: Build sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release -p argus-cli -p argus-redirector-windows
          ./scripts/stage-windivert.ps1
          node scripts/prepare-tauri-bundle.mjs windows

      - name: Package sidecar tarballs (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist
          tar -czf dist/argus-cli-x86_64-unknown-linux-gnu.tar.gz -C target/release argus-cli
          tar -czf dist/argus-sandbox-linux-x86_64.tar.gz -C target/release argus-redirector-linux
          cp scripts/install/*.sh dist/ || true

      - name: Upload sidecar assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/argus-cli-x86_64-unknown-linux-gnu.tar.gz \
            dist/argus-sandbox-linux-x86_64.tar.gz \
            dist/*.sh \
            --clobber

      - name: Package sidecar zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/argus-cli.exe -DestinationPath dist/argus-cli-x86_64-pc-windows-msvc.zip -Force
          ./scripts/stage-windivert.ps1
          $stage = "dist/sandbox-win-staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/argus-redirector-windows.exe $stage
          Copy-Item target/release/WinDivert.dll $stage -ErrorAction SilentlyContinue
          Copy-Item target/release/WinDivert64.sys $stage -ErrorAction SilentlyContinue
          Copy-Item third_party/windivert/WinDivert.dll $stage -ErrorAction SilentlyContinue
          Copy-Item third_party/windivert/WinDivert64.sys $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath dist/argus-sandbox-windows-x86_64.zip -Force
          Copy-Item scripts/install/*.ps1 dist/ -ErrorAction SilentlyContinue

      - name: Upload sidecar assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" `
            dist/argus-cli-x86_64-pc-windows-msvc.zip `
            dist/argus-sandbox-windows-x86_64.zip `
            dist/*.ps1 `
            --clobber

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [create-release, build]
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            });
