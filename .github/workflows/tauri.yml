# Compiles and tests the Argus Rust workspace.

name: Tauri

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf clang llvm libbpf-dev

      - name: Install bpf-linker
        run: cargo install --locked bpf-linker@0.9.15

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Compile workspace
        run: cargo check --workspace --all-targets

      - name: Test Argus desktop
        run: cargo test -p argus

      - name: Test shared crates
        run: |
          cargo test -p protocol
          cargo test -p ipc-client
          cargo test -p process-tree

  sidecars-linux:
    name: sidecars-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install BPF build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          cargo install --locked bpf-linker@0.9.15
      - name: Build Linux sidecars
        run: |
          cargo build --release -p argus-cli -p argus-redirector-linux

  sidecars-windows:
    name: sidecars-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build Windows sidecars
        run: cargo build --release -p argus-cli -p argus-redirector-windows
