[package]
name = "argus"
version = "0.3.0"
description = "Local-first secrets vault for developers"
authors = ["Argus Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
default-run = "argus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reset_db"
path = "src/bin/reset_db.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
protocol = { path = "../crates/protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
anyhow = "1.0.102"
thiserror = "2.0.18"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = { version = "0.8", features = ["std_rng"] }
base64 = "0.22.1"
hex = "0.4.3"
dirs = "6.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = { version = "1.8.2", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
totp-rs = { version = "5.7.1", features = ["gen_secret", "qr", "otpauth", "serde_support"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde", "fast-rng"] }
tauri-plugin-biometry = "0.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
sysinfo = "0.34"
whoami = "1"
tauri-plugin-updater = "2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
hyper = { version = "1.6", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server", "client", "tokio", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
urlencoding = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["socket", "process", "user"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

