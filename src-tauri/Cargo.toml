[package]
name = "argus"
version = "0.1.0"
description = "Local-first secrets vault for developers"
authors = ["Argus Contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
default-run = "argus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reset_db"
path = "src/bin/reset_db.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
anyhow = "1.0.102"
thiserror = "2.0.18"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = { version = "0.8", features = ["std_rng"] }
base64 = "0.22.1"
hex = "0.4.3"
dirs = "6.0.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher"] }
zeroize = { version = "1.8.2", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
totp-rs = { version = "5.7.1", features = ["gen_secret", "qr", "otpauth", "serde_support"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde", "fast-rng"] }
tauri-plugin-biometry = "0.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

