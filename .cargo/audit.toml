# cargo-audit policy for the Argus workspace.
# See: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    # tauri-utils → urlpattern → unic-* (no patched release yet)
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0098", # unic-ucd-version
    # Tauri Linux/GTK stack (desktop shell only; upstream Tauri dependency chain)
    "RUSTSEC-2024-0429", # glib VariantStrIter unsound
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    # Tauri build-time proc-macro helpers
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2026-0173", # proc-macro-error2
    # vendored mitmproxy_rs → boringtun/hickory (git-pinned / API-locked upstream)
    "RUSTSEC-2024-0344", # curve25519-dalek timing (boringtun)
    "RUSTSEC-2025-0009", # ring 0.16 AES panic (boringtun)
    "RUSTSEC-2025-0010", # ring <0.17 unmaintained (boringtun)
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 loop (no fix on 0.25.x)
    "RUSTSEC-2026-0119", # hickory-proto CPU exhaustion (needs 0.26; breaks mitmproxy API)
]
